name: Publish signed automatic update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed public release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-update-publication
  cancel-in-progress: false

jobs:
  publish-signed-update:
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == false
    runs-on: windows-latest
    timeout-minutes: 50
    environment: beta-release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Check out the authorized release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Authorize source, release assets and signing configuration
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required.' }
          if ([string]::IsNullOrWhiteSpace($env:PIMP_UPDATER_PUBLIC_KEY)) { throw 'PIMP_UPDATER_PUBLIC_KEY repository variable is required.' }
          git fetch origin main --tags
          $sha = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not reachable from approved main.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version disagree.' }
          if ($desktopVersion -ne $version -or $tauriVersion -ne $version -or $cargoVersion -ne $version) {
            throw 'Version metadata disagrees across package, desktop, Cargo and Tauri.'
          }
          cargo test --manifest-path src-tauri/Cargo.toml updater_is_a_higher_development_release_and_fails_closed_without_a_public_key
          if ($LASTEXITCODE -ne 0) { throw 'Updater public key is invalid.' }
          $assets = gh release view $env:RELEASE_TAG --json isPrerelease,publishedAt,assets | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($assets.publishedAt)) { throw 'The selected release has no immutable publication time.' }
          $classification = if ($assets.isPrerelease) { 'Development' } else { 'Stable' }
          $classificationArgument = $classification.ToLowerInvariant()
          node tools/release-policy.mjs validate $version $classificationArgument
          if ($LASTEXITCODE -ne 0) { throw 'Release classification does not match version policy.' }
          $setup = @($assets.assets | Where-Object { $_.name -like '*Setup-Unsigned.exe' -and $_.size -gt 0 })
          $checksums = @($assets.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' -and $_.size -gt 0 })
          $buildInfo = @($assets.assets | Where-Object { $_.name -eq 'BUILD-INFO.txt' -and $_.size -gt 0 })
          if ($setup.Count -ne 1 -or $checksums.Count -ne 1 -or $buildInfo.Count -ne 1) { throw 'Required public release assets are missing or empty.' }
          $inputDirectory = New-Item -ItemType Directory -Force release-input
          gh release download $env:RELEASE_TAG --pattern '*Setup-Unsigned.exe' --pattern 'SHA256SUMS.txt' --pattern 'BUILD-INFO.txt' --dir $inputDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the reviewed public release evidence.' }
          $downloadedSetup = Get-ChildItem $inputDirectory -Filter '*Setup-Unsigned.exe' -File
          if (@($downloadedSetup).Count -ne 1) { throw 'Expected exactly one downloaded NSIS setup executable.' }
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadedSetup.FullName).Hash.ToLowerInvariant()
          $checksumText = Get-Content (Join-Path $inputDirectory 'SHA256SUMS.txt') -Raw
          if (-not $checksumText.Contains("$setupHash  $($downloadedSetup.Name)")) { throw 'The reviewed NSIS setup does not match SHA256SUMS.txt.' }
          $buildText = Get-Content (Join-Path $inputDirectory 'BUILD-INFO.txt') -Raw
          if (-not $buildText.Contains("Version: $version") -or -not $buildText.Contains("Source commit: $sha")) {
            throw 'The reviewed public installer build identity does not match the selected tag.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "classification=$classification" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $channelTarget = if ($classification -eq 'Stable') { 'stable-channel' } else { 'development-channel' }
          "channel_target=$channelTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_date=$([DateTimeOffset]::Parse($assets.publishedAt).ToUniversalTime().ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pub_date=$([DateTimeOffset]::Parse($assets.publishedAt).ToUniversalTime().ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build signed NSIS updater payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PIMP_BUILD_COMMIT: ${{ steps.identity.outputs.sha }}
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
          PIMP_RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
          PIMP_RELEASE_DATE: ${{ steps.identity.outputs.release_date }}
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'

      - name: Resolve immutable versioned signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
        run: |
          $artifact = Get-ChildItem src-tauri/target/release/bundle/nsis/*.nsis.zip -File | Select-Object -First 1
          if (-not $artifact -or $artifact.Length -eq 0) { throw 'Signed updater payload is missing or empty.' }
          $signaturePath = "$($artifact.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Updater signature is missing.' }
          $checksumPath = 'src-tauri/target/release/bundle/UPDATER-SHA256SUMS.txt'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content $checksumPath
          $protectedNames = @($artifact.Name, "$($artifact.Name).sig", 'UPDATER-SHA256SUMS.txt')
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          $existing = @($release.assets | Where-Object { $protectedNames -contains $_.name })
          if ($existing.Count -ne 0 -and $existing.Count -ne $protectedNames.Count) {
            throw 'The release contains an incomplete signed updater asset set; refusing an ambiguous retry.'
          }
          if ($existing.Count -eq 0) {
            gh release upload $env:RELEASE_TAG $artifact.FullName $signaturePath $checksumPath
            if ($LASTEXITCODE -ne 0) { throw 'Publishing versioned signed updater assets failed.' }
          } else {
            $resolved = New-Item -ItemType Directory -Force existing-signed-assets
            foreach ($name in $protectedNames) {
              gh release download $env:RELEASE_TAG --pattern $name --dir $resolved
              if ($LASTEXITCODE -ne 0) { throw "Could not retrieve existing immutable asset $name." }
            }
            $existingArtifact = Join-Path $resolved $artifact.Name
            $existingSignature = "$existingArtifact.sig"
            $existingChecksum = Join-Path $resolved 'UPDATER-SHA256SUMS.txt'
            $existingHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $existingArtifact).Hash.ToLowerInvariant()
            $checksumText = Get-Content -LiteralPath $existingChecksum -Raw
            if (-not $checksumText.Contains("$existingHash  $($artifact.Name)")) {
              throw 'Existing updater checksum evidence does not match its immutable payload.'
            }
            cargo run --quiet --manifest-path src-tauri/Cargo.toml --example verify_update -- $existingArtifact $existingSignature $env:PIMP_UPDATER_PUBLIC_KEY '${{ steps.identity.outputs.version }}'
            if ($LASTEXITCODE -ne 0) { throw 'Existing updater assets fail signature verification.' }
            Copy-Item -LiteralPath $existingArtifact -Destination $artifact.FullName -Force
            Copy-Item -LiteralPath $existingSignature -Destination $signaturePath -Force
            Copy-Item -LiteralPath $existingChecksum -Destination $checksumPath -Force
          }

      - name: Verify signature and construct manifest
        shell: pwsh
        env:
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
        run: |
          $artifact = Get-ChildItem src-tauri/target/release/bundle/nsis/*.nsis.zip -File | Select-Object -First 1
          if (-not $artifact -or $artifact.Length -eq 0) { throw 'Signed updater payload is missing or empty.' }
          $signaturePath = "$($artifact.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Updater signature is missing.' }
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example verify_update -- $artifact.FullName $signaturePath $env:PIMP_UPDATER_PUBLIC_KEY '${{ steps.identity.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'Independent signature verification failed.' }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          $url = "https://github.com/Dubcodes/kairix-pimp/releases/download/$env:RELEASE_TAG/$([Uri]::EscapeDataString($artifact.Name))"
          $platforms = [ordered]@{
            '${{ steps.identity.outputs.channel_target }}' = [ordered]@{ signature = $signature; url = $url }
          }
          if ('${{ steps.identity.outputs.classification }}' -eq 'Stable') {
            $platforms['development-channel'] = [ordered]@{ signature = $signature; url = $url }
          }
          $manifest = [ordered]@{
            version = '${{ steps.identity.outputs.version }}'
            notes = Get-Content docs/BETA_RELEASE_NOTES.md -Raw
            pub_date = '${{ steps.identity.outputs.pub_date }}'
            platforms = $platforms
            classification = '${{ steps.identity.outputs.classification }}'
            size = $artifact.Length
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content src-tauri/target/release/bundle/latest.json

      - name: Verify published signed payload before channel promotion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
        run: |
          $localArtifact = Get-ChildItem src-tauri/target/release/bundle/nsis/*.nsis.zip -File | Select-Object -First 1
          $published = New-Item -ItemType Directory -Force published-verification
          gh release download $env:RELEASE_TAG --pattern $localArtifact.Name --pattern "$($localArtifact.Name).sig" --dir $published
          if ($LASTEXITCODE -ne 0) { throw 'Could not read back the published updater payload and signature.' }
          $remoteArtifact = Join-Path $published $localArtifact.Name
          $remoteSignature = "$remoteArtifact.sig"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $remoteArtifact).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $localArtifact.FullName).Hash) {
            throw 'Published updater payload bytes differ from the verified local payload.'
          }
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example verify_update -- $remoteArtifact $remoteSignature $env:PIMP_UPDATER_PUBLIC_KEY '${{ steps.identity.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'Published updater signature verification failed.' }

      - name: Publish approved channel manifest last
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = 'src-tauri/target/release/bundle/latest.json'
          $channel = '${{ steps.identity.outputs.channel_target }}'
          function Publish-Channel([string]$target) {
            $current = New-Item -ItemType Directory -Force "channel-$target"
            gh release view $target *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release download $target --pattern latest.json --dir $current
              if ($LASTEXITCODE -ne 0) { throw "Could not read the current $target manifest." }
              $currentManifest = Get-Content (Join-Path $current 'latest.json') -Raw | ConvertFrom-Json
              $comparison = node tools/release-policy.mjs compare '${{ steps.identity.outputs.version }}' $currentManifest.version
              if ($LASTEXITCODE -ne 0) { throw "Could not compare the candidate with the current $target version." }
              if ($comparison -eq 'older') { throw "Refusing to roll $target back from $($currentManifest.version)." }
              if ($comparison -eq 'equal') {
                $candidateHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash
                $currentHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $current 'latest.json')).Hash
                if ($candidateHash -ne $currentHash) { throw "The existing $target manifest uses this version with different bytes." }
                return
              }
              gh release upload $target $manifest --clobber
            } else {
              gh release create $target $manifest --prerelease --latest=false --title "Kairix PIMP approved $target" --notes 'Machine-readable signed update channel.'
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified $target manifest." }
          }
          Publish-Channel $channel
          if ('${{ steps.identity.outputs.classification }}' -eq 'Stable') {
            Publish-Channel 'development-channel'
          }

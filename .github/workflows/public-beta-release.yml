name: Publish approved public Windows release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Exact internal SemVer to publish (for example 0.2.0)
        required: true
        type: string
      classification:
        description: Explicit release classification
        required: true
        type: choice
        options:
          - development
          - stable
      stable_approval:
        description: For Stable only, enter APPROVE STABLE followed by the exact version
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  publish-approved-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 50
    environment: ${{ inputs.classification == 'stable' && 'stable-release' || 'public-beta-release' }}
    steps:
      - name: Check out reviewed main source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg for acceptance tests
        run: choco install ffmpeg --no-progress --yes

      - name: Validate reviewed source and version metadata
        id: identity
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $head = (git rev-parse HEAD).Trim()
          $approvedMain = (git rev-parse origin/main).Trim()
          if ($head -ne $approvedMain) { throw 'The checked-out commit is not current approved main.' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $version = $package.version
          if ($version -ne '${{ inputs.confirm_version }}') { throw 'Confirmation does not match package.json.' }
          if ($desktop.version -ne $version -or $tauri.version -ne $version -or $cargoVersion -ne $version) {
            throw 'Version metadata disagrees across package, Cargo and Tauri.'
          }
          node tools/release-policy.mjs validate $version '${{ inputs.classification }}'
          if ($LASTEXITCODE -ne 0) { throw 'Version policy validation failed.' }
          if ('${{ inputs.classification }}' -eq 'stable' -and '${{ inputs.stable_approval }}' -ne "APPROVE STABLE $version") {
            throw 'Stable publication requires the exact protected approval phrase.'
          }
          $tag = "v$version"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) { throw "Tag $tag already exists." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short_sha=$($head.Substring(0,12))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "classification=${{ inputs.classification }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_date=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run complete verification
        run: |
          npm test
          npm run lint
          npm run format
          npm run build
          npm audit --audit-level=high
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate optional automatic-update bootstrap key
        shell: pwsh
        env:
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PIMP_UPDATER_PUBLIC_KEY)) {
            'UPDATER_STATUS=Automatic updates disabled; no public key was embedded.' | Out-File $env:GITHUB_ENV -Append
          } else {
            cargo test --manifest-path src-tauri/Cargo.toml updater_is_a_higher_development_release_and_fails_closed_without_a_public_key
            if ($LASTEXITCODE -ne 0) { throw 'The configured updater public key is invalid.' }
            'UPDATER_STATUS=Automatic updates configured with the validated repository public key.' | Out-File $env:GITHUB_ENV -Append
          }

      - name: Build public unsigned MSI and NSIS installers
        env:
          PIMP_BUILD_COMMIT: ${{ steps.identity.outputs.sha }}
          PIMP_UPDATER_PUBLIC_KEY: ${{ vars.PIMP_UPDATER_PUBLIC_KEY }}
          PIMP_RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
          PIMP_RELEASE_DATE: ${{ steps.identity.outputs.release_date }}
        run: npm run tauri -- build --bundles msi,nsis

      - name: Verify and stage public assets
        shell: pwsh
        run: |
          $version = '${{ steps.identity.outputs.version }}'
          $stage = New-Item -ItemType Directory -Force release-assets
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe -File | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -File | Select-Object -First 1
          if (-not $nsis -or -not $msi -or $nsis.Length -eq 0 -or $msi.Length -eq 0) { throw 'Both nonempty bundles are required.' }
          $recommended = Join-Path $stage "Kairix-PIMP-Light-$version-Windows-x64-Setup-Unsigned.exe"
          $alternative = Join-Path $stage "Kairix-PIMP-Light-$version-Windows-x64-Unsigned.msi"
          Copy-Item $nsis.FullName $recommended
          Copy-Item $msi.FullName $alternative
          Get-ChildItem $stage -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $stage 'SHA256SUMS.txt')
          @(
            'Kairix PIMP Light — Windows Release'
            "Version: $version"
            "Classification: ${{ steps.identity.outputs.classification }}"
            "Release date: ${{ steps.identity.outputs.release_date }}"
            "Source commit: ${{ steps.identity.outputs.sha }}"
            'Authenticode signed: no'
            $env:UPDATER_STATUS
          ) | Set-Content (Join-Path $stage 'BUILD-INFO.txt')
          $bytes = [System.IO.File]::ReadAllBytes('src-tauri/target/release/kairix-pimp.exe')
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68) -ne 2) { throw 'Release executable is not a Windows GUI application.' }

      - name: Stage and publish permanent public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.identity.outputs.tag }}'
          git tag $tag '${{ steps.identity.outputs.sha }}'
          git push origin "refs/tags/$tag"
          $assets = Get-ChildItem release-assets -File
          $classification = '${{ steps.identity.outputs.classification }}'
          $displayVersion = node -e "const v=process.argv[1].split('.'); console.log(v[2]==='0'?v.slice(0,2).join('.'):process.argv[1])" '${{ steps.identity.outputs.version }}'
          $title = "Kairix PIMP Light $displayVersion — $($classification.Substring(0,1).ToUpper())$($classification.Substring(1))"
          gh release create $tag --verify-tag --draft --latest=false --notes-file docs/BETA_RELEASE_NOTES.md --title $title
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft public release.' }
          gh release upload $tag $assets.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload every public beta asset; the release remains a draft.' }
          $published = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($asset in $assets) {
            $remote = @($published.assets | Where-Object { $_.name -eq $asset.Name -and [long]$_.size -eq $asset.Length })
            if ($remote.Count -ne 1) { throw "Published asset verification failed for $($asset.Name); the release remains a draft." }
          }
          if ($classification -eq 'stable') {
            gh release edit $tag --draft=false --prerelease=false --latest
          } else {
            gh release edit $tag --draft=false --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not promote the verified draft to a public release.' }

      - name: Request protected signed updater publication when configured
        if: vars.PIMP_UPDATER_PUBLIC_KEY != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run signed-beta-update.yml --ref main -f release_tag='${{ steps.identity.outputs.tag }}'

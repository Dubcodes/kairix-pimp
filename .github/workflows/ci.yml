name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Build production web application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

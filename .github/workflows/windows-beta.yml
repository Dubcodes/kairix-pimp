name: Windows development installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg for acceptance tests
        run: choco install ffmpeg --no-progress --yes

      - name: Run TypeScript and web checks
        run: |
          npm test
          npm run lint
          npm run format
          npm run build
          npm audit --audit-level=high

      - name: Run native checks
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned keyless MSI and NSIS installers
        env:
          PIMP_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run tauri -- build --bundles msi,nsis

      - name: Verify release executable uses the Windows GUI subsystem
        shell: pwsh
        run: |
          $executable = Get-Item src-tauri/target/release/kairix-pimp.exe
          $bytes = [System.IO.File]::ReadAllBytes($executable.FullName)
          if ($bytes.Length -lt 256) { throw 'Release executable is unexpectedly small.' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem. A console window would accompany the installed app."
          }

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          node tools/release-policy.mjs validate $version development
          if ($LASTEXITCODE -ne 0) { throw 'Development version policy validation failed.' }
          if ('${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release tag must exactly match package version: expected $expectedTag"
          }

      - name: Verify bundles and record build identity
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $sourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          $buildSha = '${{ github.sha }}'
          $shortSha = $sourceSha.Substring(0, 12)
          $bundleRoot = (Resolve-Path src-tauri/target/release/bundle).Path
          $installers = @(
            Get-ChildItem src-tauri/target/release/bundle/msi/*.msi
            Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          )
          if ($installers.Count -lt 2) {
            throw "Expected both MSI and NSIS installers, found $($installers.Count)"
          }
          $empty = @($installers | Where-Object { $_.Length -eq 0 })
          if ($empty.Count -gt 0) {
            throw "Installer output is empty: $($empty.FullName -join ', ')"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          @(
            "Kairix PIMP Windows beta"
            "Version: $version"
            "Source commit: $sourceSha"
            "Build/test commit: $buildSha"
            "Unsigned: yes"
            "FFmpeg/FFprobe: optional PATH-based tools; not bundled"
            "Windows may display a SmartScreen warning because this internal beta is not code-signed."
          ) | Set-Content src-tauri/target/release/bundle/BUILD-INFO.txt
          $installers | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            $relativePath = [System.IO.Path]::GetRelativePath($bundleRoot, $_.FullName).Replace('\', '/')
            "$hash  $relativePath"
          } | Set-Content src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Kairix-PIMP-${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}-unsigned-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/BUILD-INFO.txt
            src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Upload Premiere Companion developer source
        uses: actions/upload-artifact@v4
        with:
          name: Kairix-PIMP-Premiere-Companion-${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}-developer-source
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/premiere-companion/index.html
            apps/premiere-companion/index.js
            apps/premiere-companion/manifest-core.cjs
            apps/premiere-companion/manifest.json
            apps/premiere-companion/styles.css
            docs/PREMIERE_INTEGRATION.md

      - name: Build separately identified disposable cleanup acceptance installer
        env:
          PIMP_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/cleanup-acceptance
        run: npm run tauri -- build --bundles nsis --features cleanup-acceptance --config src-tauri/tauri.cleanup-acceptance.conf.json

      - name: Verify cleanup acceptance package identity
        shell: pwsh
        run: |
          $sourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          $shortSha = $sourceSha.Substring(0, 12)
          $bundleRoot = (Resolve-Path src-tauri/target/cleanup-acceptance/release/bundle).Path
          $installer = Get-Item src-tauri/target/cleanup-acceptance/release/bundle/nsis/*-setup.exe
          if ($installer.Length -eq 0) { throw 'Cleanup acceptance installer is empty.' }
          if ($installer.Name -notmatch 'Cleanup Acceptance') {
            throw "Acceptance installer name is not visibly distinct: $($installer.Name)"
          }
          $config = Get-Content src-tauri/tauri.cleanup-acceptance.conf.json -Raw | ConvertFrom-Json
          if ($config.identifier -ne 'com.kairix.pimp.cleanup-acceptance') {
            throw 'Cleanup acceptance application identifier is not isolated.'
          }
          "CLEANUP_ACCEPTANCE_SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          @(
            'Kairix PIMP disposable cleanup acceptance build'
            "Source commit: $sourceSha"
            'Synthetic fixtures on an empty removable volume only'
            'Isolated application identifier and settings directory'
            'Never install or use with production camera media'
          ) | Set-Content "$bundleRoot/CLEANUP-ACCEPTANCE-BUILD-INFO.txt"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  nsis/$($installer.Name)" | Set-Content "$bundleRoot/CLEANUP-ACCEPTANCE-SHA256SUMS.txt"

      - name: Upload disposable cleanup acceptance installer
        uses: actions/upload-artifact@v4
        with:
          name: Kairix-PIMP-${{ env.APP_VERSION }}-${{ env.CLEANUP_ACCEPTANCE_SHORT_SHA }}-cleanup-acceptance-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/cleanup-acceptance/release/bundle/nsis/*-setup.exe
            src-tauri/target/cleanup-acceptance/release/bundle/CLEANUP-ACCEPTANCE-BUILD-INFO.txt
            src-tauri/target/cleanup-acceptance/release/bundle/CLEANUP-ACCEPTANCE-SHA256SUMS.txt
